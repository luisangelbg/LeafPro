<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LeafPro — galería de prueba del motor</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { padding: 20px; }
  .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .it { border: 1px solid var(--border); border-radius: 10px; padding: 6px; text-align: center; background: var(--card-bg); }
  .it svg { width: 100%; height: 130px; }
  .it div { font-size: .72rem; color: var(--text-muted); }
  h2 { margin: 24px 0 8px; }
</style>
<script src="../js/i18n.js"></script>
</head>
<body>
<h1>Galería del motor de hojas</h1>
<div id="out"></div>
<script src="../js/core.js"></script>
<script src="../js/leafgen.js"></script>
<script src="../js/morphdata.js"></script>
<script>
const out = document.getElementById('out');
let html = '';
for (const cat of MORPH.cats) {
  html += `<h2>${cat.key}</h2><div class="g">`;
  for (const t of MORPH.byCat(cat.key)) {
    let svg;
    try {
      svg = t.compound ? Leaf.compound(t.compound, {}) : Leaf.svg(t.model, { highlight: t.hl, skin: t.skin });
    } catch (e) { svg = `<div style="color:red">${e.message}</div>`; }
    html += `<div class="it">${svg}<div>${t.es}</div></div>`;
  }
  html += '</div>';
}
out.innerHTML = html;
</script>
</body>
</html>
